# ─────────────────────────────────────────────────────────────
# Cloudflare Pages — client build & deployment.
#
# Recommended setup: connect this repository to a Cloudflare Pages
# project (dashboard → Workers & Pages → Create → Pages → Connect to Git).
# Cloudflare then builds and deploys automatically on every push; the `ci`
# job below simply verifies the same build before Cloudflare runs it.
#
#   Build command:          npm --prefix client ci && npm --prefix client run build
#   Build output directory: client/dist
#   Environment variable:   VITE_API_URL = https://api.your-domain
#
# The optional `deploy` job (manual trigger only) publishes from GitHub
# Actions instead. It needs these repo Settings → Secrets and variables:
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: VITE_API_URL, optional CF_PAGES_PROJECT (default "quickfix")
# Do not enable both automatic paths at once (Cloudflare Git builds AND
# the deploy job on push) — this workflow only deploys on manual dispatch.
# ─────────────────────────────────────────────────────────────
name: Client build & Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "wrangler.toml"
      - ".nvmrc"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "client/**"
      - "wrangler.toml"
      - ".nvmrc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Build client
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

  deploy:
    name: Deploy (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Validate VITE_API_URL is configured
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL repository variable is not set."
            echo "Set it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: client
          command: >-
            pages deploy dist
            --project-name ${{ vars.CF_PAGES_PROJECT || 'quickfix' }}
            --branch ${{ github.ref_name }}
