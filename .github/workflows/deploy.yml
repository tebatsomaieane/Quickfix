# ─────────────────────────────────────────────────────────────
# Build the QuickFix client and deploy it to Cloudflare Pages.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN   (Cloudflare Pages: Edit)
#              CLOUDFLARE_ACCOUNT_ID
#   Variables: VITE_API_URL           e.g. https://api.quickfix.co.ls
#              CF_PAGES_PROJECT        optional, defaults to "quickfix"
#
# Every push to main (and manual runs) deploys; pull requests only run
# lint + build. Do NOT also connect this repo through Cloudflare's Git
# integration, or each push would deploy twice.
# ─────────────────────────────────────────────────────────────
name: Deploy client to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "wrangler.toml"
      - ".nvmrc"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "client/**"
      - "wrangler.toml"
      - ".nvmrc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Validate VITE_API_URL is configured
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL repository variable is not set."
            echo "Set it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Build client
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: client
          command: >-
            pages deploy dist
            --project-name ${{ vars.CF_PAGES_PROJECT || 'quickfix' }}
            --branch ${{ github.ref_name }}
