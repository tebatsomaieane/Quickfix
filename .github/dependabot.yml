version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # wrangler-action v4 requires a dashboard API token and refuses the
      # mounted OAuth config that deploy.yml relies on.
      - dependency-name: "cloudflare/wrangler-action"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: weekly
    groups:
      vite:
        patterns: ["vite", "@vitejs/*", "@tailwindcss/*", "esbuild"]
      react:
        patterns: ["react", "react-dom", "react-router-dom", "@types/react*"]
      lint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "globals"]
    ignore:
      # Wrangler >= 4.146 regressed OAuth-config auth in non-interactive CI:
      # `pages deploy` with the mounted ~/.config/.wrangler/config/default.toml
      # fails with "necessary to set a CLOUDFLARE_API_TOKEN". 4.145.0 is pinned
      # and proved to deploy via the OAuth mount. Remove when a later wrangler
      # is verified to work without a dashboard token.
      - dependency-name: "wrangler"
        versions: [">=4.146.0"]

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: weekly