# Cloudflare Pages configuration.
#
# Primary method — GitHub Actions (.github/workflows/deploy.yml):
#   Every push to main builds client/ and deploys client/dist to the
#   "quickfix" Pages project. No dashboard API token needed: the runner
#   mounts the base64-encoded wrangler login config (WRANGLER_OAUTH_B64
#   secret) into ~/.wrangler/config/default.toml and wrangler authenticates
#   with it. CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID are accepted as an
#   alternative. VITE_API_URL is a variable (falls back to the standard
#   quickfix URL when unset).
#
# Alternative — Cloudflare Pages Git integration:
#   1. Dashboard → Workers & Pages → Create → Pages → Connect to Git.
#   2. Framework preset: Vite
#      Build command: npm --prefix client ci && npm --prefix client run build
#      Build output directory: client/dist
#   3. Set the build environment variable VITE_API_URL to your API origin,
#      e.g. https://api.quickfix.co.ls
#   Node is pinned by .nvmrc (22). Do not enable this together with the
#   Actions deploy, or each push would deploy twice.
#
# Alternative — direct CLI deploy from the repo root:
#   npm --prefix client ci && npm --prefix client run build
#   npx wrangler pages deploy   # uses pages_build_output_dir below
name = "quickfix"
pages_build_output_dir = "client/dist"