# ─────────────────────────────────────────────────────────────
# QuickFix — full stack deployment (client + API + MySQL)
#
#   docker compose up -d --build
#
# The client container (nginx) serves the React app on port 80 and
# proxies /api to the server container.
# ─────────────────────────────────────────────────────────────
services:
  db:
    image: mysql:8.0
    container_name: quickfix-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-quickfix}
      MYSQL_USER: ${DB_USER:-quickfix_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-quickfix_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quickfix-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-quickfix_user}
      DB_PASSWORD: ${DB_PASSWORD:-quickfix_password}
      DB_NAME: ${DB_NAME:-quickfix}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the shell}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      LOG_FORMAT: ${LOG_FORMAT:-combined}
    expose:
      - "5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SHOW_DEMO: ${VITE_SHOW_DEMO:-false}
    container_name: quickfix-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-80}:80"

volumes:
  db_data: