# ─────────────────────────────────────────────────────────────
# QuickFix — full stack deployment (client + API + MySQL)
#
#   docker compose up -d --build
#
# The client container (nginx) serves the React app on port 80 and
# proxies /api to the server container.
# ─────────────────────────────────────────────────────────────
services:
  db:
    image: mysql:8.0
    container_name: quickfix-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-quickfix}
      MYSQL_USER: ${DB_USER:-quickfix_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-quickfix_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: quickfix-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-quickfix_user}
      DB_PASSWORD: ${DB_PASSWORD:-quickfix_password}
      DB_NAME: ${DB_NAME:-quickfix}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the shell}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      LOG_FORMAT: ${LOG_FORMAT:-combined}
      # Cross-site deployments (frontend on Cloudflare Pages, API here) require
      # SameSite=none so the browser sends the session cookie to this API.
      # Keep lax for the same-origin compose setup.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # Absolute public base used for uploaded-media URLs and password-reset
      # email links when this API sits behind a proxy / second origin.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Content-Security-Policy origins. These must match the two public
      # addresses below, or the browser blocks the app's own API calls and
      # uploaded media. PUBLIC_API_URL is used as the API origin fallback.
      API_ORIGIN: ${API_ORIGIN:-${PUBLIC_API_URL:-}}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # SMTP for login 2FA codes and password resets. Leave SMTP_* empty to
      # run without email (codes are then printed to the server console for
      # local testing); registration and login work either way.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-QuickFix <no-reply@quickfix.co.ls>}
    expose:
      - "5000"
    volumes:
      - uploads_data:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: quickfix-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-80}:80"

volumes:
  db_data:
  uploads_data: