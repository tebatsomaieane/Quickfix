# ─────────────────────────────────────────────────────────────
# QuickFix — production stack for a single VPS / server:
#   MySQL + API + client (nginx) + Caddy (automatic HTTPS).
#
#   1. Create a DNS A record:  DOMAIN -> this server's public IP.
#   2. Copy .env.example to .env and set DOMAIN, ACME_EMAIL, JWT_SECRET,
#      and the MySQL credentials.
#   3. From the repo root:
#        docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Caddy obtains and renews a Let's Encrypt certificate for DOMAIN and
# proxies everything to the client container (nginx), which serves the SPA
# and forwards /api and /uploads to the API.
# ─────────────────────────────────────────────────────────────
services:
  db:
    image: mysql:8.0
    container_name: quickfix-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-quickfix}
      MYSQL_USER: ${DB_USER:-quickfix_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: quickfix-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-quickfix_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-quickfix}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Same-origin behind Caddy, so CORS is skipped; set CLIENT_ORIGIN and
      # PUBLIC_APP_URL to https://<DOMAIN> in .env for correct email links.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      LOG_FORMAT: ${LOG_FORMAT:-combined}
    volumes:
      - uploads_data:/app/uploads

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: quickfix-client
    restart: unless-stopped
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    container_name: quickfix-caddy
    restart: unless-stopped
    depends_on:
      - client
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (a hostname pointing at this server)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
